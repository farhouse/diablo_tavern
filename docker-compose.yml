services:
  app:
    build:
      context: .
    command: pnpm dev --host 0.0.0.0
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: diablo_management
      JWT_SECRET: dev-secret-change-me
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_nuxt:/app/.nuxt

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  app_node_modules:
  app_nuxt:
  mongo_data:
